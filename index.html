<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <meta name="description" content="Mapa de objetivos em espiral com caminho, semana e lembretes.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Espiral">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Espiral — objetivos</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot"></span>Espiral</div>
    <nav class="tabs" id="tabs">
      <button data-view="mapa" class="on">Universo</button>
      <button data-view="semana">Semana</button>
      <button data-view="lista">Lista</button>
    </nav>
    <div class="top-actions">
      <button class="hidden" id="btn-install" data-action="instalar" title="Instalar o app neste aparelho">⤓ Instalar</button>
      <button class="primary" data-action="novo">+ Objetivo</button>
      <button class="ghost" data-action="config" title="Configurações">⚙</button>
    </div>
  </header>

  <main id="main"></main>
  <div id="modal" class="modal hidden"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
